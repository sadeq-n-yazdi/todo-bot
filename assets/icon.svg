<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0" stop-color="#147A7A"/>
      <stop offset="1" stop-color="#0E3B57"/>
    </linearGradient>
    <!-- Same gradient expressed in the bell group's rotated space, so the outline matches the background -->
    <linearGradient id="bgBell" xlink:href="#bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024" gradientTransform="rotate(-16) scale(1.0869565) translate(-659.2 -394.24)"/>
    <path id="bell" d="M0 -112 C-64 -112 -92 -64 -92 -4 L-92 34 C-92 58 -110 70 -118 88 L118 88 C110 70 92 58 92 34 L92 -4 C92 -64 64 -112 0 -112 Z M-22 -126 A22 22 0 1 0 22 -126 A22 22 0 1 0 -22 -126 Z M-30 98 A30 30 0 0 0 30 98 Z"/>
  </defs>

  <!-- Background: fills the canvas so Telegram's circular crop looks intentional -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Checklist card -->
  <g transform="translate(512 512) scale(0.92) translate(-530 -482)">
  <rect x="250" y="330" width="440" height="460" rx="76" fill="#FFFFFF"/>

  <!-- Row 1: done -->
  <rect x="306" y="400" width="124" height="124" rx="32" fill="#147A7A"/>
  <path d="M336 463 L360 490 L400 436" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="462" y="436" width="84" height="52" rx="26" fill="#147A7A" fill-opacity="0.45"/>

  <!-- Row 2: pending -->
  <rect x="319" y="609" width="98" height="98" rx="24" fill="none" stroke="#147A7A" stroke-width="26"/>
  <rect x="462" y="632" width="172" height="52" rx="26" fill="#147A7A" fill-opacity="0.45"/>
  </g>

  <!-- Bell, with an outline in the background gradient so it sits cleanly on the card -->
  <g transform="translate(659.2 394.24) scale(0.92) rotate(16)">
    <use xlink:href="#bell" fill="url(#bgBell)" stroke="url(#bgBell)" stroke-width="56" stroke-linejoin="round"/>
    <use xlink:href="#bell" fill="#F5A524"/>
  </g>
</svg>
