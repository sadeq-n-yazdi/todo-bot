name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cache linter
        uses: actions/cache@v4
        with:
          path: bin
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', 'go.mod') }}
      - run: make vet
      - run: make lint
      - run: make test
      - run: make check-deploy
      - run: make build-linux ARCH=amd64
      - run: make build-linux ARCH=arm64
