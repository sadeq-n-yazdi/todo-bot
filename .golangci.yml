version: "2"
linters:
  default: standard   # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - bodyclose
    - errorlint
  settings:
    errcheck:
      exclude-functions:
        - (github.com/sadeq-n-yazdi/todo-bot/internal/tg.Sender).AnswerCallback
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
